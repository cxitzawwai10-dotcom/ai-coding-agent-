name: Phase 2 Security Tests

on:
  push:
    branches:
      - security/phase-2-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run automated tests
        timeout-minutes: 8
        run: npm test -- --test-reporter=spec --test-timeout=30000
