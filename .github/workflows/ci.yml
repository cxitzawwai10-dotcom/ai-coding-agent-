name: CI

on:
  push:
    branches:
      - main
      - security/phase-2-hardening
  pull_request:
    branches:
      - main
      - security/phase-2-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run automated tests
        run: npm test

      - name: Validate Android Termux launcher syntax
        run: bash -n scripts/termux-start.sh

  docker-sandbox:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare sandbox image
        run: docker pull node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5

      - name: Run real Docker isolation test
        env:
          AI_AGENT_DOCKER_INTEGRATION: "1"
        run: node --test tests/docker-test-sandbox.integration.test.js
